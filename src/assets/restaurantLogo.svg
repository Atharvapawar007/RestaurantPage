<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512">

    <!-- ========================= -->
    <!-- Viking Badge -->
    <!-- ========================= -->

    <circle
        cx="256"
        cy="180"
        r="115"
        fill="none"
        stroke="#8B6B3F"
        stroke-width="8"/>

    <!-- ========================= -->
    <!-- Helmet -->
    <!-- ========================= -->

    <!-- Helmet Dome -->
    <path
        d="
            M180 210
            A76 76 0 0 1 332 210
            L332 235
            L180 235
            Z"
        fill="#9AA1A8"
        stroke="#333"
        stroke-width="4"/>

    <!-- Nose Guard -->
    <rect
        x="247"
        y="145"
        width="18"
        height="90"
        rx="5"
        fill="#444"/>

    <!-- Brow -->
    <path
        d="
            M190 188
            L322 188"
        stroke="#444"
        stroke-width="10"
        stroke-linecap="round"/>

    <!-- Eyes -->
    <path
        d="
            M210 198
            L238 208
            L210 214
            Z"
        fill="#222"/>

    <path
        d="
            M302 198
            L274 208
            L302 214
            Z"
        fill="#222"/>

    <!-- Left Horn -->
    <path
        d="
            M180 155
            C120 120 110 65 165 70
            C145 100 160 135 188 150"
        fill="none"
        stroke="#F3E3B5"
        stroke-width="12"
        stroke-linecap="round"/>

    <!-- Right Horn -->
    <path
        d="
            M332 155
            C392 120 402 65 347 70
            C367 100 352 135 324 150"
        fill="none"
        stroke="#F3E3B5"
        stroke-width="12"
        stroke-linecap="round"/>

    <!-- Rivets -->
    <circle cx="205" cy="182" r="4" fill="#DDD"/>
    <circle cx="230" cy="182" r="4" fill="#DDD"/>
    <circle cx="282" cy="182" r="4" fill="#DDD"/>
    <circle cx="307" cy="182" r="4" fill="#DDD"/>

    <!-- ========================= -->
    <!-- Decorative Line -->
    <!-- ========================= -->

    <line
        x1="90"
        y1="340"
        x2="422"
        y2="340"
        stroke="#8B6B3F"
        stroke-width="2"/>

    <!-- ========================= -->
    <!-- Text -->
    <!-- ========================= -->

    <text
        x="256"
        y="385"
        text-anchor="middle"
        font-size="46"
        font-family="Georgia"
        font-weight="700"
        fill="white">
        THE ODIN'S
    </text>

    <text
        x="256"
        y="430"
        text-anchor="middle"
        font-size="52"
        font-family="Georgia"
        font-weight="700"
        fill="white">
        INN
    </text>

</svg>